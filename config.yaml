paths: # همه مسیرها نسبت به محل همین config.yaml هستند
  assets: assets # پوشه منابع فقط خواندنی
  input: input # ورودی‌های خام فقط خواندنی
  output: output # محل گزارش و خروجی مراحل بعد
  cache: cache # فایل‌های میانی؛ منابع هرگز بازنویسی نمی‌شوند
  debug: debug # شواهد تصویری و گزارش مرحله ۳
  samples: samples # نمونه‌های مرجع فقط خواندنی
asset_patterns: # هر الگو باید دقیقاً یک فایل پیدا کند
  syllabus: '*Syllabus*.xlsx' # فایل سیلابس
  template: '*First_Page_Template*.pdf' # تمپلیت فرست‌پیج
  border: '*Sarbarg*.pdf' # بوردر دو نواری مرحله ۳
  font: '*Aria-Regular*.otf' # فونت متن فارسی فرست‌پیج
  template_qa: '*First_Page_With_Questions_Answers*.pdf' # فرست‌پیج ترکیبی سوال و پاسخ
  frame_qa: '*Frame_Purple_QA*.pdf' # قاب مستقل QA؛ بدون همپوشانی با Sarbarg
optional_asset_roles: [template_qa, frame_qa] # فقط با درخواست صریح roles کشف و اجباری می‌شوند؛ مسیر قدیمی همان چهار منبع
qa: # قرارداد اعتبارسنجی منابع Q1؛ هنوز مسیر تولید QA فعال نیست
  formula: # دستور زبان محدود Q4؛ هیچ اصلاح متنی یا فونت جایگزین انجام نمی‌شود
    superscript_marker: '^' # نشانهٔ توان؛ خود نشانه چاپ نمی‌شود
    subscript_marker: '_' # نشانهٔ زیرنویس؛ خود نشانه چاپ نمی‌شود
    opening_brace: '{' # شروع گروه؛ گروه تودرتو پشتیبانی نمی‌شود
    closing_brace: '}' # پایان گروه؛ بسته‌نشدن گروه خطاست
    base_pattern: '[A-Za-z][A-Za-z0-9]*' # پایهٔ لاتین؛ اتصال به و فارسی مجاز است
    atom_pattern: '[A-Za-z0-9]' # بدون آکولاد فقط یک نویسه؛ چند نویسه باید گروه‌بندی شود
    math_symbols: '√²³₂π∑' # نشانه‌های صریح ریاضی برای کنترل گلیف حتی بدون ^ یا _
    proof: # فقط ساخت شاهد آزمایشی Q4؛ مستقل از چیدمان فرست‌پیج
      page_size: [720, 180] # اندازهٔ صفحهٔ آزمایشی به پوینت
      margin: 24 # حاشیهٔ صفحهٔ آزمایشی به پوینت
      font_size: 28 # اندازهٔ Aria برای مشاهدهٔ واضح توان و فارسی
      dpi: 150 # وضوح شاهد و مقایسهٔ پیکسلی طبق برنامه
      line_height: 1.8 # فضای کافی برای توان و زیرنویس در شاهد
      base_color: '#0000ff' # رنگ تشخیصی پایه، فقط در آزمون پیکسلی
      script_color: '#ff0000' # رنگ تشخیصی توان/زیرنویس برای جداسازی جوهر
      text_color: '#000000' # رنگ متن شاهد فارسی نهایی
  kind_suffix_aliases: # فقط پس از شکست تمام تطبیق‌های قبلی و با هشدار REVIEW
    soul: soal # غلط املایی تأییدشدهٔ واژهٔ پایانی؛ فقط به رکورد سوال
  kinds: # ترتیب هر جفت تمپلیت
    soal:
      sheet_suffix: '-سوال' # پسوند شیت؛ برای مراحل بعد
      namak_suffix: '_soal' # پسوند نامک؛ برای مراحل بعد
      template_offset: 0 # اولین صفحهٔ هر جفت
      title: 'سوالات' # عنوان دیداری تأییدشده
      title_en: soal # عنوان نوع در برچسب انگلیسی ترمینال
      extracted_title: 'سواالت' # ترتیب یونیکد استخراج‌شده از PDF موجود؛ تصویر عنوان درست است
    pasokh:
      sheet_suffix: '-پاسخ' # پسوند شیت؛ برای مراحل بعد
      namak_suffix: '_pasokh' # پسوند نامک؛ برای مراحل بعد
      template_offset: 1 # دومین صفحهٔ هر جفت
      title: 'پاسخنامه' # عنوان دیداری
      title_en: pasokh # عنوان نوع در برچسب انگلیسی ترمینال
      extracted_title: 'پاسخنامه' # متن استخراج‌شدهٔ عنوان
  template_pages:
    total: 56 # کل صفحات فایل ترکیبی
    first: 29 # شروع QA؛ یک‌مبنا
    last: 56 # پایان QA؛ شامل این صفحه
    size: [612, 792] # Letter عمودی به پوینت
    tolerance: 0.01 # فقط تلورانس عددی ابعاد PDF به پوینت
    comparison_dpi: 30 # مقایسهٔ اطلاعاتی صفحات قدیمی
  cover:
    fields: [course, chapter, topic] # سه فیلد بدون استاد
    placeholder: '…' # نشانگر جای مقدار در تمپلیت
    page_size_policy: input # اندازهٔ مؤثر ورودی؛ native برای بررسی مستقل تمپلیت باقی است
    min_scale: 0.6 # همان حداقل مسیر قدیمی؛ برای جا شدن متن تغییر داده نمی‌شود
    scale_step: 0.01 # گام کاهش اندازه؛ همان مسیر قدیمی
    max_lines: [2, 2, 4] # حداکثر خطوط درس، فصل و مبحث
    line_height: 1.15 # نسبت ارتفاع خط، همان مسیر قدیمی
    frame_margin_em: 0.7 # فاصلهٔ مقدار از داخل قاب برحسب اندازهٔ برچسب
    row_group_em: 0.15 # تلورانس اتصال برچسب و سه‌نقطهٔ همان ردیف
    guard_em: 3 # فضای اضافهٔ رسم برای آشکارشدن سرریز، نه پنهان‌کردن آن
    baseline_em: 0.875 # خط پایهٔ Story با Aria و line-height=1.15؛ در پروب Q5 اندازه‌گیری شد
    multiline_alignment: center # حالت تأییدشدهٔ متن بلند جزوه‌ها؛ بدون فاصلهٔ مصنوعی میان واژه‌ها
    max_word_gap_em: 1.0 # سقف فاصلهٔ افقی واژه‌ها نسبت به فونت؛ انتخاب اندازه در همان بازهٔ مجاز
    story_alignment: justify # پیش‌فرض تک‌خطی در RTL راست‌چین؛ متن چندخطی از multiline_alignment استفاده می‌کند
    erase_color: [1, 1, 1] # پوشش سفید دقیقاً روی bbox نویسهٔ سه‌نقطه
    qc_dpi: 150 # کنترل تغییر پیکسل طبق Q5
    raster_inset_pixels: 1 # رسم یک پیکسل به داخل؛ ناحیهٔ مجاز QC گسترش نمی‌یابد
  frame:
    content_margin: 4 # فاصلهٔ جوهر محتوا از لبهٔ داخلی قاب به پوینت، همان حاشیهٔ قدیمی
    raster_guard_pixels: 1 # انتقال محتوا یک پیکسل بیشتر به داخل؛ باند کنترل کوچک نمی‌شود
  asset_validation:
    frame_pages: 1 # تعداد صفحات منبع قاب
    frame_segments: 8 # دو مستطیل، هرکدام چهار خط
    frame_widths: 2 # تعداد ضخامت‌های متمایز؛ مقدار واقعی از PDF خوانده می‌شود
    frame_colors: 1 # یک رنگ؛ مقدار واقعی از PDF خوانده می‌شود
resolved_assets: # نام‌های کشف‌شده؛ کشف مجدد با الگو مرجع اجراست
  syllabus: assets/Comprehensive_Syllabus_19 (1)(1).xlsx # سیلابس موجود
  template: assets/First_Page_Template (1)(1).pdf # تمپلیت موجود
  border: assets/01-Olampiom-Sarbarg-1- (1)(1).pdf # بوردر موجود
  font: assets/02-Aria-Regular.otf # فونت موجود
output_version: v01 # نسخه نام خروجی
output_prefix: LessonNote_hard # پیشوند نام خروجی
tool_version: v1.1-lean+ui # نسخهٔ پایهٔ ابزار همراه با توسعهٔ رابط؛ مستقل از نسخهٔ نام PDF
reports: # فقط نمایش و بایگانی؛ هیچ اثری بر PDF یا QC ندارد
  thumbnail_width: 320 # عرض بندانگشتی JPEG خروجی بر حسب پیکسل
  jpeg_quality: 70 # کیفیت بندانگشتی، نه کیفیت PDF
  retain_runs: 20 # تعداد اجراهای اخیر در output/reports
cli:
  ignore_prefix: LessonNote_ # خروجی‌های قبلی ورودی محسوب نشوند
  office_extensions: [.doc, .docx, .ppt, .pptx] # تبدیل آفلاین با LibreOffice در صورت وجود
fallback_sheet: ویدیو های حل سوال جدید # منبع جایگزین؛ فقط پس از نبود نامک در شیت‌های رشته‌ای
field_aliases: # فقط تعیین رشتهٔ شیت جایگزین؛ متن درس تغییر نمی‌کند
  سواد: سواد رسانه # نگاشت تأییدشده به کلید تمپلیت
  "مبانی پایه": سلول # نگاشت تأییدشدهٔ مالک در Q8؛ متن درس حفظ می‌شود
  "فناوری‌های نوین مرتبط": سلول # نگاشت تأییدشدهٔ مالک در Q8؛ متن درس حفظ می‌شود
  "حل تمرین شیمی": شیمی # نگاشت تأییدشدهٔ مالک در Q8؛ متن درس حفظ می‌شود
ignorable_suffix_words: [unsolved] # برای تطبیق کنار گذاشته می‌شود و در نام خروجی می‌ماند
header_scan_rows: 5 # محدوده تشخیص هدر طبق قرارداد مرحله ۱
headers: # نام‌های معنایی ستون؛ هیچ وابستگی به جای ثابت ستون نیست
  namak: [نامک] # کلید تطبیق
  teacher: [نام استاد, استاد] # در نبود این هدرها fallback کنترل‌شده
  course: [درس] # عنوان درس
  chapter: [فصل] # عنوان فصل
  topic: [مبحث] # عنوان مبحث
field_labels_en: # برچسب‌های ترمینال؛ فقط برای نمایش انگلیسی، متن PDF تغییر نمی‌کند
  هوش مصنوعی: artificial intelligence
  علوم زمین: earth sciences
  ادبی: literature
  ریاضی: mathematics
  نانو: nanotechnology
  فیزیک: physics
  سواد رسانه: media literacy
  کامپیوتر: computer science
  زیست شناسی: biology
  سلول: cell biology
  نجوم: astronomy
  اقتصاد: economics
  جغرافیا: geography
  شیمی: chemistry
sheet_to_template: # شماره یک‌مبنای تمپلیت در بلوک عمودی؛ شیت‌های دارای اولویت
  هوش مصنوعی: 1 # تمپلیت هوش مصنوعی
  علوم زمین: 2 # تمپلیت علوم زمین
  ادبی: 3 # تمپلیت ادبی
  ریاضی: 4 # تمپلیت ریاضی
  نانو: 5 # عنوان: علوم و فناوری نانو
  فیزیک: 6 # تمپلیت فیزیک
  سواد رسانه: 7 # تمپلیت سواد رسانه‌ای
  کامپیوتر: 8 # تمپلیت کامپیوتر
  زیست شناسی: 9 # تمپلیت زیست‌شناسی
  سلول: 10 # عنوان: سلول‌های بنیادین و پزشکی بازساختی
  نجوم: 11 # تمپلیت نجوم و اخترفیزیک
  اقتصاد: 12 # عنوان: اقتصاد، مدیریت و حکمرانی
  جغرافیا: 13 # تمپلیت جغرافیا
  شیمی: 14 # تمپلیت شیمی
header_overrides: # استثناهای تأییدشدهٔ کاربر؛ نام واقعی هدر همچنان کنترل می‌شود
  جغرافیا: # هدرهای تکراری V/W ستون دادهٔ آموزشی نیستند
    namak: B # تأیید کاربر: نامک از B، نه V
    course: D # تأیید کاربر: درس از D، نه W
cover: # تنظیمات هندسه و چیدمان مرحله ۲؛ مختصات از تمپلیت استخراج می‌شود
  fields: [teacher, course, chapter, topic] # ترتیب برچسب‌ها از بالا به پایین
  label_size_hint: 19 # اندازه تقریبی برچسب طبق مشاهده مرحله صفر
  label_size_tolerance: 1 # تلورانس تشخیص اندازه برچسب بر حسب پوینت
  row_group_em: 0.15 # تلورانس گروه‌بندی originها نسبت به اندازه برچسب
  frame_margin_em: 0.7 # حاشیه داخل کادر برای حفظ تزئین گوشه‌ها
  label_gap_em: 0.2 # فاصله سمت راست مقدار تا چپ‌ترین برچسب
  row_top_em: 1.35 # فاصله بالای ردیف از baseline برچسب؛ مستقل از bbox متریک
  line_height: 1.15 # نسبت ارتفاع خط HTML به اندازه فونت
  min_scale: 0.6 # کوچک‌ترین اندازه مجاز طبق قرارداد
  scale_step: 0.01 # کاهش یک درصدی پس از امتحان اندازه کامل
  max_lines: [2, 2, 2, 4] # حداکثر خطوط استاد، درس، فصل، مبحث
  qc_dpi: 150 # وضوح ثابت QC و مقایسه نمونه
  ink_threshold: 245 # آستانه جوهر برای اندازه‌گیری bbox؛ معیار تغییر بیرونی بدون تلورانس است
  guard_em: 3 # فضای شاهد اطراف لایه متن برای آشکارشدن خروج جوهر
border: # کالیبراسیون با اندازه‌گیری مجدد مسیرها و متن؛ واحد پوینت
  clean_filename: border_clean.pdf # فقط در paths.cache ذخیره شود
  source_size: [595.276, 841.890] # اندازه بوردر اندازه‌گیری‌شده
  geometry_tolerance: 0.01 # تلورانس اندازه منبع، نه تلورانس پوشش محتوا
  number_text: '١' # تنها متن حذف‌شونده از اصل بوردر
  retained_text: BALATAR.GROUP # نوشته الزامی فوتر
  strips: # سه تکه هر نوار؛ تنها تکه میانی نسبت عرض را تغییر می‌دهد
    header: # stroke هدر تا y=49.982 ادامه دارد؛ y=49 موجب بریدگی می‌شود
      y: [11, 51] # شامل تمام stroke با حاشیه شفاف
      cuts: [80, 540] # بیرون لوگوها و گوشه‌ها؛ وسط فقط خطوط ساده
      anchor: top # فاصله از بالای صفحه با مقیاس یکنواخت حفظ شود
    footer:
      y: [803, 841.890] # شروع شکل 803.837؛ انتها محدود به صفحه اصلی
      cuts: [40, 460] # نشانی و فلش داخل کلاهک راست می‌مانند
      anchor: bottom # فوتر به پایین صفحه متصل باشد
pages: # سیاست محافظه‌کارانه حذف و اندازه‌گیری پوشش
  image_warning_max_fraction: 0.30 # فقط تصاویر کوچک‌تر از ۳۰٪ مساحت صفحه در پایین صفحه هشدار شمارهٔ نامعلوم دارند
  bottom_fraction: 0.08 # فقط پایین‌ترین هشت درصد جهت مؤثر
  qc_bottom_fraction: 0.15 # پس از کوچک‌سازی محتوا، بررسی شماره در پایین‌ترین پانزده درصد؛ حذف همچنان فقط هشت درصد ورودی
  number_patterns: # fullmatch کل خط؛ اعداد داخل جمله حذف نمی‌شوند
    - '\d+'
    - '(?:\S+\s+){0,3}(?:Page|صفحه)\s*[:：]?\s*\d+' # حداکثر سه واژه پیشوند؛ کل خط باید با Page/صفحه و عدد پایان یابد
    - 'New\s+Section\s+\d+(?:\s+Page\s+\d+)?'
  diagnostic_dpi: 150 # رندر فقط برای هشدار و مقایسه؛ نه انتقال محتوا
  paper_rule_rgb: [202, 235, 253] # اندازه‌گیری مسیرهای افقی تکرارشونده در هر ۱۵ صفحه فیزیک؛ گرد کردن RGB×255
  paper_margin_rgb: [255, 80, 80] # رنگ خط عمودی بلند حاشیهٔ کاغذ؛ از مسیر برداری ورودی اندازه‌گیری شد
  paper_color_tolerance: 2 # فاصله هر کانال از ترکیب خطوط کاغذ با سفید و تقاطع ضربی آن‌ها؛ صرفاً طبقه‌بندی جوهر، نه QC حفظ پیکسل
  ink_margin: 8 # جوهر معنادار: min(R,G,B)<min(paper_rule_rgb)-8 یعنی کمتر از 194؛ خطوط کم‌رنگ کاغذ کنار می‌روند
  rule_min_width_fraction: 0.5 # تشخیص خط کاغذ: خط افقی بلندتر از نصف عرض صفحه
  rule_horizontal_tolerance: 0.01 # تلورانس y دو سر خط، پوینت
  rule_min_repetitions: 10 # تکرار لازم برای تمایز خطوط کاغذ از خطوط شکل‌ها
  bake_max_channel_difference: 2 # مجوز صریح کاربر، فقط قبل/بعد bake
  bake_bbox_margin_pixels: 3 # مجوز صریح کاربر؛ بیرون bbox annotation با این حاشیه اختلاف صفر
  fit_top_margin: 4 # فاصلهٔ محتوای مقیاس‌شده از پایین واقعی نوار هدر، پوینت
  fit_bottom_margin: 4 # فاصلهٔ محتوای مقیاس‌شده از بالای واقعی نوار فوتر، پوینت
qc:
  blocking: # نام کنترل‌ها بدون پیشوند «صفحه محتوا N: »
    - باز شدن PDF
    - تعداد صفحات
    - اندازه و جهت و rotation
    - جهت فرست‌پیج
    - رندر فرست‌پیج فقط در چهار ناحیه
    - فرست‌پیج بدون بوردر و برابر مرجع نوشتن
    - چهار مقدار دقیق و ناتهی
    - نام فایل
    - فونت Aria Regular جاسازی‌شده

qc_qa: # کنترل‌های مستقل QA؛ هیچ تغییری در qc قدیمی نیست
  blocking:
    - باز شدن PDF
    - تعداد صفحات
    - نام فایل
    - تعداد شواهد صفحات
    - اندازه و جهت فرست‌پیج
    - سه مقدار دقیق
    - نبود استاد و متن اضافی
    - تغییر فقط در سه ناحیه
    - فرست‌پیج برابر مرجع
    - فونت Aria جاسازی‌شده
    - اندازه و جهت و rotation
    - رندر محتوا
    - نبود شماره متن
    - متن حفظ‌شده
    - تصاویر حفظ‌شده
    - قاب معتبر
    - ساختار لایه قاب
    - جوهر زیر قاب صفر
    - خطای کنترل کیفیت

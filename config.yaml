paths: # همه مسیرها نسبت به محل همین config.yaml هستند
  assets: assets # پوشه منابع فقط خواندنی
  input: input # ورودی‌های خام فقط خواندنی
  output: output # محل گزارش و خروجی مراحل بعد
asset_patterns: # هر الگو باید دقیقاً یک فایل پیدا کند
  syllabus: '*Syllabus*.xlsx' # فایل سیلابس
  template: '*First_Page_Template*.pdf' # تمپلیت فرست‌پیج
  border: '*Sarbarg*.pdf' # بوردر؛ در این مرحله باز نمی‌شود
  font: '*Aria-Regular*.otf' # فونت متن فارسی فرست‌پیج
resolved_assets: # نام‌های کشف‌شده؛ کشف مجدد با الگو مرجع اجراست
  syllabus: assets/Comprehensive_Syllabus_19 (1)(1).xlsx # سیلابس موجود
  template: assets/First_Page_Template (1)(1).pdf # تمپلیت موجود
  border: assets/01-Olampiom-Sarbarg-1- (1)(1).pdf # بوردر موجود
  font: assets/02-Aria-Regular.otf # فونت موجود
output_version: v01 # نسخه نام خروجی
output_prefix: LessonNote_hard # پیشوند نام خروجی
header_scan_rows: 5 # محدوده تشخیص هدر طبق قرارداد مرحله ۱
headers: # نام‌های معنایی ستون؛ هیچ وابستگی به جای ثابت ستون نیست
  namak: [نامک] # کلید تطبیق
  teacher: [نام استاد, استاد] # در نبود این هدرها fallback کنترل‌شده
  course: [درس] # عنوان درس
  chapter: [فصل] # عنوان فصل
  topic: [مبحث] # عنوان مبحث
sheet_to_template: # شماره یک‌مبنای تمپلیت در بلوک عمودی؛ فقط این شیت‌ها خوانده می‌شوند
  هوش مصنوعی: 1 # تمپلیت هوش مصنوعی
  علوم زمین: 2 # تمپلیت علوم زمین
  ادبی: 3 # تمپلیت ادبی
  ریاضی: 4 # تمپلیت ریاضی
  نانو: 5 # عنوان: علوم و فناوری نانو
  فیزیک: 6 # تمپلیت فیزیک
  سواد رسانه: 7 # تمپلیت سواد رسانه‌ای
  کامپیوتر: 8 # تمپلیت کامپیوتر
  زیست شناسی: 9 # تمپلیت زیست‌شناسی
  سلول: 10 # عنوان: سلول‌های بنیادین و پزشکی بازساختی
  نجوم: 11 # تمپلیت نجوم و اخترفیزیک
  اقتصاد: 12 # عنوان: اقتصاد، مدیریت و حکمرانی
  جغرافیا: 13 # تمپلیت جغرافیا
  شیمی: 14 # تمپلیت شیمی
header_overrides: # استثناهای تأییدشدهٔ کاربر؛ نام واقعی هدر همچنان کنترل می‌شود
  جغرافیا: # هدرهای تکراری V/W ستون دادهٔ آموزشی نیستند
    namak: B # تأیید کاربر: نامک از B، نه V
    course: D # تأیید کاربر: درس از D، نه W
cover: # تنظیمات هندسه و چیدمان مرحله ۲؛ مختصات از تمپلیت استخراج می‌شود
  fields: [teacher, course, chapter, topic] # ترتیب برچسب‌ها از بالا به پایین
  label_size_hint: 19 # اندازه تقریبی برچسب طبق مشاهده مرحله صفر
  label_size_tolerance: 1 # تلورانس تشخیص اندازه برچسب بر حسب پوینت
  row_group_em: 0.15 # تلورانس گروه‌بندی originها نسبت به اندازه برچسب
  frame_margin_em: 0.7 # حاشیه داخل کادر برای حفظ تزئین گوشه‌ها
  label_gap_em: 0.2 # فاصله سمت راست مقدار تا چپ‌ترین برچسب
  row_top_em: 1.35 # فاصله بالای ردیف از baseline برچسب؛ مستقل از bbox متریک
  line_height: 1.15 # نسبت ارتفاع خط HTML به اندازه فونت
  min_scale: 0.6 # کوچک‌ترین اندازه مجاز طبق قرارداد
  scale_step: 0.01 # کاهش یک درصدی پس از امتحان اندازه کامل
  max_lines: [2, 2, 2, 4] # حداکثر خطوط استاد، درس، فصل، مبحث
  qc_dpi: 150 # وضوح ثابت QC و مقایسه نمونه
  ink_threshold: 245 # آستانه جوهر برای اندازه‌گیری bbox؛ معیار تغییر بیرونی بدون تلورانس است
  guard_em: 3 # فضای شاهد اطراف لایه متن برای آشکارشدن خروج جوهر
